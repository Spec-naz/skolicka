<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Školička</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
<style>
:root { --bg: #fff8e7; --card: #ffffff; --ink: #263238; --muted: #6b7a85; --accent: #ff7043; --accent2: #29b6f6; --ok: #43a047; --ko: #e53935; --radius: 22px; --shadow: 0 6px 18px rgba(38,50,56,.10); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Nunito", "Arial Rounded MT Bold", "Avenir Next", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; user-select: none; }
#app { max-width: 1100px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 12px 16px 24px; }
button { font: inherit; cursor: pointer; color: inherit; }
h1, h2, h3 { margin: .4em 0; }
.lead { color: var(--muted); font-size: 1.1rem; }
.hint { color: var(--muted); font-size: .92rem; }
.warn { background: #fff3e0; border-radius: 12px; padding: 10px 14px; color: #8d6e63; font-size: .92rem; }
code { background: #eceff1; padding: 1px 6px; border-radius: 6px; }

/* ── hlavička ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 12px; }
.top h2 { font-size: 1.3rem; }
.who { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; }
.avatar { font-size: 2.2rem; }
.gear, .back { background: var(--card); border: 0; border-radius: 50%; width: 52px; height: 52px; font-size: 1.4rem; box-shadow: var(--shadow); }
.back { font-size: 1.1rem; }

/* ── domů ── */
.home { display: flex; flex-direction: column; gap: 18px; margin-top: 4vh; }
.big-btn { border: 0; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 1.5rem; font-weight: 800; transition: transform .12s; }
.big-btn:active { transform: scale(.97); }
.big-btn .ic { font-size: 4.5rem; line-height: 1; }
.big-btn small { color: var(--muted); font-size: .95rem; font-weight: 600; }
.big-btn.play { background: linear-gradient(135deg, #ffd180, #ff8a65); color: #4e342e; }
.home-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.big-btn.choose { background: linear-gradient(135deg, #b3e5fc, #81d4fa); } .big-btn.stickers { background: linear-gradient(135deg, #fff59d, #ffe082); }
.stickers-wall { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; } .sticker { font-size: 3rem; background: #fff; border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); } .sticker.big { font-size: 5rem; }

/* ── výběr ── */
.grid-domains, .grid-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.dom, .sk { border: 0; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); padding: 22px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; border-bottom: 8px solid var(--c); }
.dom .ic, .sk .ic { font-size: 3.4rem; line-height: 1; }
.lv { display: inline-flex; gap: 4px; } .lv i { width: 12px; height: 12px; border-radius: 50%; background: #e0e0e0; display: inline-block; } .lv i.on { background: var(--ok); } .lv i.cur { background: #ffb300; box-shadow: 0 0 0 3px #ffecb3; }

/* ── sezení ── */
.session-top .progress { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.dot { width: 26px; height: 26px; border-radius: 50%; background: #eceff1; display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; }
.dot.cur { background: #ffe082; box-shadow: 0 0 0 4px #fff3c4; } .dot.ok { background: #fff; } .dot.ko { background: #e0e0e0; }
.domtag { font-size: 1.6rem; width: 52px; text-align: center; }
.task { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 70vh; }
.task-head { display: flex; align-items: center; gap: 14px; }
.btn-speak { border: 0; background: #e1f5fe; border-radius: 50%; width: 60px; height: 60px; font-size: 1.7rem; flex: none; }
.prompt { font-size: 1.45rem; font-weight: 800; } .prompt.small { font-size: 1.2rem; font-weight: 700; color: #37474f; } .big-hint { font-size: 2rem; }
.stimulus { display: flex; justify-content: center; align-items: center; min-height: 120px; flex-wrap: wrap; gap: 16px; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; align-items: stretch; }
.options.wide { grid-template-columns: 1fr 1fr; } .options.grid3 { grid-template-columns: repeat(3, 1fr); max-width: 520px; margin: 0 auto; }
.opt { border: 4px solid #eceff1; background: #fafafa; border-radius: 20px; min-height: 110px; display: flex; align-items: center; justify-content: center; padding: 10px; transition: transform .1s, border-color .15s, background .15s; position: relative; }
.opt:hover { border-color: #b3e5fc; } .opt:active { transform: scale(.96); }
.opt.sel { border-color: var(--accent2); background: #e1f5fe; }
.opt.correct { border-color: var(--ok); background: #e8f5e9; animation: pop .35s; } .opt.reveal { animation: pulse 1s 2; }
.opt.wrong { border-color: var(--ko); background: #ffebee; animation: shake .4s; }
.opt.done { opacity: .8; } .opt:disabled { cursor: default; } .opt-disabled { visibility: hidden; }
.ord { position: absolute; top: -10px; right: -10px; background: var(--ok); color: #fff; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
.feedback { min-height: 1.6em; text-align: center; font-size: 1.25rem; font-weight: 800; color: #37474f; }
.btn-confirm { align-self: center; border: 0; background: var(--ok); color: #fff; font-size: 2rem; width: 90px; height: 70px; border-radius: 20px; box-shadow: var(--shadow); }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
@keyframes pop { 0% { transform: scale(1) } 50% { transform: scale(1.08) } 100% { transform: scale(1) } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(67,160,71,.0) } 50% { box-shadow: 0 0 0 10px rgba(67,160,71,.35) } }

/* ── views ── */
.emo { font-size: 3rem; line-height: 1.15; } .emo-big { font-size: 6rem; }
.txt { font-size: 2.6rem; font-weight: 800; } .txt-big { font-size: 5rem; } .txt-letter { font-family: "Arial", "Helvetica", sans-serif; letter-spacing: .04em; } .txt-label { font-size: 1.3rem; }
.egroup { display: grid; gap: 6px; justify-content: center; } .egroup .emo { font-size: 2.6rem; } .egroup.small .emo { font-size: 1.9rem; }
.egroup.scatter { position: relative; width: 420px; height: 240px; max-width: 100%; display: block; } .egroup.scatter .emo { position: absolute; }
.row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.seq { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.chip { background: #e3f2fd; border-radius: 14px; padding: 8px 18px; font-size: 2.2rem; font-weight: 800; min-width: 64px; text-align: center; } .chip-q { background: #ffe082; }
.eq { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; } .op { font-size: 3rem; font-weight: 800; color: #546e7a; }
.pw { display: flex; align-items: center; gap: 18px; } .badge { background: #ffe082; border-radius: 50%; width: 64px; height: 64px; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; }
.hand { font-size: 5rem; position: relative; } .hand .q { position: absolute; bottom: 0; right: -6px; font-size: 2rem; background: #fff; border-radius: 50%; padding: 0 8px; font-weight: 800; }
.ew { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; } .ew .emo { font-size: 4rem; } .ew.small .emo { font-size: 2.6rem; } .ew-word { font-size: 1.6rem; font-weight: 800; letter-spacing: .05em; } .ew.small .ew-word { font-size: 1.1rem; }
.claps { font-size: 1.8rem; letter-spacing: 2px; }
.analogy { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; } .analogy .emo { font-size: 3.4rem; } .arr { font-size: 2rem; color: #90a4ae; } .sep { width: 30px; }
.halfgrid { display: flex; align-items: center; } .mirror { width: 4px; height: 130px; background: #90a4ae; margin: 0 6px; border-radius: 2px; } .halfq { width: 130px; height: 130px; display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; color: #90a4ae; border: 3px dashed #cfd8dc; border-radius: 10px; }
.parts { display: inline-flex; align-items: center; gap: 4px; } .plus { font-size: 1.5rem; color: #90a4ae; font-weight: 800; }
.watch { font-size: 4rem; text-align: center; grid-column: 1/-1; } .cover { font-size: 5rem; color: #90a4ae; }
.slots { display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 8px; } .slot { width: 70px; height: 80px; border: 3px dashed #90a4ae; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 2.6rem; font-weight: 800; font-family: Arial, sans-serif; } .slot.filled { border-style: solid; border-color: var(--ok); background: #e8f5e9; } .slot.reveal { border-color: #ffb300; background: #fff8e1; }
.sgrid { display: grid; gap: 6px; } .scell { width: 84px; height: 84px; display: inline-flex; align-items: center; justify-content: center; font-size: 2.6rem; background: #fff; border: 3px solid #cfd8dc; border-radius: 12px; } .scell.hidden { background: #fffde7; border-color: #ffe082; cursor: pointer; } .scell.sel { border-color: var(--accent2); box-shadow: 0 0 0 4px #b3e5fc; } .scell.filled { background: #e8f5e9; border-color: var(--ok); } .scell.wrong { animation: shake .4s; border-color: var(--ko); } .scell.reveal { background: #fff8e1; border-color: #ffb300; }
.sgrid .scell:nth-child(4n+2) { margin-right: 10px; } .sgrid .scell:nth-child(n+9) { margin-top: 10px; } .sgrid .scell:nth-child(n+13) { margin-top: 0; }
.mgrid { display: grid; gap: 12px; grid-column: 1/-1; width: min(560px, 100%); margin: 0 auto; } .card { border: 0; }
.mgrid .card { position: relative; aspect-ratio: 1; border-radius: 16px; background: #42a5f5; font-size: 2.6rem; display: flex; align-items: center; justify-content: center; transition: transform .3s; box-shadow: var(--shadow); } .mgrid .card .front { display: none; } .mgrid .card.open, .mgrid .card.matched { background: #fff; transform: rotateY(180deg); } .mgrid .card.open .front, .mgrid .card.matched .front { display: block; transform: rotateY(180deg); } .mgrid .card.open .back, .mgrid .card.matched .back { display: none; } .mgrid .card.matched { opacity: .55; }
.simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; grid-column: 1/-1; width: min(420px, 100%); margin: 0 auto; } .pad { width: 100%; aspect-ratio: 1; min-height: 120px; border: 0; border-radius: 24px; opacity: .55; transition: opacity .1s, transform .1s; box-shadow: var(--shadow); } .pad.lit { opacity: 1; transform: scale(1.04); }
.gng { width: 240px; height: 240px; border-radius: 50%; border: 6px dashed #cfd8dc; background: #fafafa; font-size: 7rem; color: transparent; transition: background .1s; } .gng.show { color: inherit; background: #fff; border-style: solid; } .gng.hit { background: #e8f5e9; } .gng.miss { background: #ffebee; } .gng-hint { position: absolute; right: 24px; top: 90px; font-size: 1.6rem; opacity: .6; }
.empty { display: block; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 16px 22px; display: flex; gap: 14px; align-items: center; font-size: 1.2rem; animation: pop .4s; z-index: 5; } .toast .ic { font-size: 2.6rem; }

/* ── konec ── */
.end { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4vh; } .confetti { font-size: 5rem; } .new-sticker { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: var(--radius); padding: 16px 30px; box-shadow: var(--shadow); } .ev { background: #fff8e1; padding: 6px 14px; border-radius: 12px; }
.row-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; } .parent-note { color: var(--muted); font-size: .9rem; margin-top: 20px; }
.btn { border: 0; border-radius: 14px; padding: 12px 22px; font-size: 1.05rem; font-weight: 800; background: #eceff1; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: inline-block; } .btn.primary { background: var(--accent); color: #fff; } .btn.danger { background: #ffcdd2; color: #b71c1c; }

/* ── onboarding / rodič ── */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; } .card.small { max-width: 360px; }
.onboarding { max-width: 620px; margin: 4vh auto; user-select: text; } .onboarding form, .settings { display: flex; flex-direction: column; gap: 12px; } label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; } label input[type=checkbox] { margin-right: 8px; } .settings label:has(input[type=checkbox]) { flex-direction: row; align-items: center; }
input, select { font: inherit; padding: 10px 12px; border: 2px solid #cfd8dc; border-radius: 12px; background: #fff; } .avatars { display: flex; flex-wrap: wrap; gap: 8px; } .av input { display: none; } .av span { font-size: 2.2rem; padding: 6px 10px; border-radius: 14px; border: 3px solid transparent; display: inline-block; cursor: pointer; } .av input:checked + span { border-color: var(--accent2); background: #e1f5fe; }
.gate { position: fixed; inset: 0; background: rgba(38,50,56,.5); display: flex; align-items: center; justify-content: center; z-index: 10; } .gate form { display: flex; gap: 8px; } .gate input { width: 100px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .tab { border: 0; background: #eceff1; border-radius: 12px; padding: 10px 16px; font-weight: 700; } .tab.on { background: var(--accent2); color: #fff; }
.parent { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; user-select: text; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; } .kpi { background: #f5f7f8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; } .kpi b { font-size: 1.5rem; } .kpi small { color: var(--muted); }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 6px 0; } .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; } .c-bar { width: 100%; background: #ffe0b2; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; justify-content: flex-end; min-height: 2px; } .c-ok { background: #ff8a65; border-radius: 6px 6px 0 0; } .col small { color: var(--muted); font-size: .7rem; margin-top: 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .95rem; } .tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid #eceff1; vertical-align: top; } .tbl th { color: var(--muted); font-weight: 700; font-size: .85rem; }
.bar { height: 10px; background: #eceff1; border-radius: 5px; overflow: hidden; width: 160px; } .bar i { display: block; height: 100%; }
.locked { opacity: .55; } .strug td:first-child { border-left: 4px solid #ffb74d; } .tag { background: #fff3e0; padding: 1px 6px; border-radius: 6px; color: #8d6e63; } .nowrap { white-space: nowrap; }
.mini { border: 0; background: #eceff1; border-radius: 8px; width: 30px; height: 30px; font-weight: 800; margin-left: 4px; }
.recs { display: flex; flex-direction: column; gap: 10px; } .rec { display: flex; gap: 12px; background: #f5f7f8; border-radius: 14px; padding: 12px; border-left: 6px solid #cfd8dc; } .rec.p1 { border-color: #ff7043; } .rec.p2 { border-color: #ffb74d; } .rec.p3 { border-color: #66bb6a; } .rec .ic { font-size: 1.8rem; } .rec p { margin: 4px 0 0; color: #455a64; }
.ws-list li { margin: 6px 0; } form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } form.inline input { flex: 1; min-width: 160px; }
@media (max-width: 640px) { #app { padding: 8px 10px 16px; } .home-row { grid-template-columns: 1fr; } .big-btn { font-size: 1.2rem; padding: 20px; } .big-btn .ic { font-size: 3.4rem; } .task { padding: 12px 12px 18px; } .options { grid-template-columns: repeat(2, 1fr); gap: 10px; } .options.grid3 { grid-template-columns: repeat(3, 1fr); } .opt { min-height: 84px; padding: 6px; } .emo { font-size: 2.2rem; } .egroup .emo { font-size: 2rem; } .egroup.small .emo { font-size: 1.5rem; } .txt { font-size: 2rem; } .txt-big { font-size: 3.4rem; } .egroup.scatter { width: 100%; height: 200px; } .gng { width: 180px; height: 180px; font-size: 5rem; } .gng-hint { right: 10px; top: 70px; } .chip { font-size: 1.6rem; padding: 6px 12px; min-width: 48px; } .op { font-size: 2.2rem; } .scell { width: 60px; height: 60px; font-size: 1.9rem; } .slot { width: 54px; height: 64px; font-size: 2rem; } .prompt { font-size: 1.15rem; } .btn-speak { width: 50px; height: 50px; } .stimulus { gap: 8px; } }

</style>
